name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Format, lint, typecheck, test, validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check opendashcan tests tools

      - name: Ruff lint
        run: ruff check opendashcan tests tools

      - name: Mypy
        run: mypy opendashcan

      - name: Pytest
        run: pytest

      - name: Validate evidence YAML
        run: python tools/validate_evidence.py

      - name: Generate docs + registry snapshot
        run: python tools/generate_docs.py

      - name: Validate JSON schemas
        run: |
          python -c "from pathlib import Path; import json; from jsonschema import Draft202012Validator; root=Path('schemas');
[Draft202012Validator.check_schema(json.loads(p.read_text(encoding='utf-8'))) for p in root.glob('*.json')]; print('schemas ok')"
