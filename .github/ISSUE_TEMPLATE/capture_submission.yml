name: Capture submission
description: Contribute a CAN capture (or link to one)
title: "[capture] "
labels: ["capture"]
body:
  - type: dropdown
    id: synthetic
    attributes:
      label: Is this synthetic?
      options: ["no — real vehicle", "yes — synthetic"]
    validations:
      required: true
  - type: input
    id: vehicle
    attributes:
      label: Vehicle
    validations:
      required: true
  - type: input
    id: bus
    attributes:
      label: Bus name / bitrate
  - type: textarea
    id: access
    attributes:
      label: How to obtain the files
      description: Community captures may be linked rather than committed.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: PII scrubbed (VIN ASCII, locations, accounts)
        - label: Manifest fields prepared (see schemas/capture_manifest.schema.json)
        - label: License / redistribution rights stated
