<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>ODC-REC-RPI-1A block schematic</title>
  <rect width="960" height="640" fill="#f7f7f4"/>
  <text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#1a1a1a">ODC-REC-RPI-1A  Block schematic (LISTEN ONLY)</text>
  <text x="24" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#555">Rev A · Not for TX builds · Pins OBD 4/5/6/14/16</text>

  <rect x="40" y="100" width="160" height="120" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="55" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">J1962 OBD</text>
  <text x="55" y="152" font-family="Consolas,monospace" font-size="12">16 VIN</text>
  <text x="55" y="170" font-family="Consolas,monospace" font-size="12">6  CAN-H</text>
  <text x="55" y="188" font-family="Consolas,monospace" font-size="12">14 CAN-L</text>
  <text x="55" y="206" font-family="Consolas,monospace" font-size="12">4/5 GND</text>

  <rect x="260" y="90" width="180" height="80" rx="8" fill="#e8f5e9" stroke="#222" stroke-width="2"/>
  <text x="275" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Power</text>
  <text x="275" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="12">F2A · Schottky · TVS</text>
  <text x="275" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="12">Buck ’ 5V to Pi</text>

  <rect x="260" y="200" width="180" height="100" rx="8" fill="#fff3e0" stroke="#222" stroke-width="2"/>
  <text x="275" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">CAN PHY</text>
  <text x="275" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="12">ESD · 120R jumper</text>
  <text x="275" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="12">SN65HVD230</text>
  <text x="275" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="12">RXD’MCP · TXD idle</text>

  <rect x="500" y="160" width="200" height="120" rx="8" fill="#e3f2fd" stroke="#222" stroke-width="2"/>
  <text x="515" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">MCP2515</text>
  <text x="515" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="12">16.000 MHz XTAL</text>
  <text x="515" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="12">SPI0 · INT GPIO25</text>
  <text x="515" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="12">CS CE0</text>
  <text x="515" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="12">TX path unused</text>

  <rect x="760" y="150" width="160" height="140" rx="8" fill="#f3e5f5" stroke="#222" stroke-width="2"/>
  <text x="775" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Pi Zero 2 W</text>
  <text x="775" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="12">5V / GND</text>
  <text x="775" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="12">SocketCAN can0</text>
  <text x="775" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="12">listen-only on</text>
  <text x="775" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="12">candump ’ SD</text>

  <line x1="200" y1="140" x2="260" y2="130" stroke="#222" stroke-width="2"/>
  <line x1="200" y1="180" x2="260" y2="250" stroke="#222" stroke-width="2"/>
  <line x1="440" y1="250" x2="500" y2="220" stroke="#222" stroke-width="2"/>
  <line x1="700" y1="220" x2="760" y2="220" stroke="#222" stroke-width="2"/>
  <line x1="440" y1="130" x2="760" y2="170" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="40" y="360" width="880" height="220" rx="8" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="56" y="390" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">SPI map (BCM)</text>
  <text x="56" y="418" font-family="Consolas,monospace" font-size="13">/CS ’ GPIO8 (CE0) · SCK ’ GPIO11 · MOSI ’ GPIO10 · MISO ’ GPIO9 · INT ’ GPIO25</text>
  <text x="56" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Power</text>
  <text x="56" y="476" font-family="Consolas,monospace" font-size="13">OBD16 ’ F1 ’ D_REV ’ VIN_BUCK ’ 5V_PI · TVS to GND · Pi 3V3 feeds U1/U2</text>
  <text x="56" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Termination</text>
  <text x="56" y="534" font-family="Consolas,monospace" font-size="13">JP_TERM default OPEN (vehicle already terminated on OBD tap)</text>
  <text x="56" y="564" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b71c1c">LISTEN ONLY  do not populate transceiver silent-pin configs that enable TX drivers in production firmware.</text>
</svg>
