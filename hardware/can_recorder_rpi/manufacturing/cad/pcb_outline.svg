<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <title>ODC-REC-HAT-A PCB outline</title>
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="24" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111">ODC-REC-HAT-A outline (mm)  65.0 × 56.5</text>
  <!-- scale: 8 px/mm -->
  <g transform="translate(100,80)">
    <rect x="0" y="0" width="520" height="452" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
    <rect x="0" y="0" width="520" height="452" fill="#e8f5e9" stroke="#1b5e20" stroke-width="3"/>
    <text x="12" y="28" font-family="Consolas,monospace" font-size="14">65.0 mm</text>
    <text x="12" y="48" font-family="Consolas,monospace" font-size="14">56.5 mm</text>
    <!-- header keepout -->
    <rect x="40" y="60" width="40" height="332" fill="#bbdefb" stroke="#0d47a1" stroke-width="2"/>
    <text x="90" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="12">2×20 header keepout</text>
    <!-- CAN zone -->
    <rect x="320" y="80" width="160" height="120" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="332" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="12">CAN PHY zone</text>
    <text x="332" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="12">U2 + ESD + TERM</text>
    <!-- power zone -->
    <rect x="320" y="240" width="160" height="120" fill="#fce4ec" stroke="#880e4f" stroke-width="2"/>
    <text x="332" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="12">Power zone</text>
    <text x="332" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="12">F1 · buck · TVS</text>
    <circle cx="40" cy="40" r="8" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="480" cy="40" r="8" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="40" cy="412" r="8" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="480" cy="412" r="8" fill="none" stroke="#333" stroke-width="2"/>
    <text x="12" y="440" font-family="Segoe UI,Arial,sans-serif" font-size="11">M2.5 holes (Pi pattern)</text>
  </g>
</svg>
