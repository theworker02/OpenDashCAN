# Honda Civic 10th Gen (approx. 2016–2021) — TARGET / donor cluster evidence
# Document opendbc vehicle-bus messages. Cluster consumption NOT bench-verified.

vehicle_id: honda-civic10
cluster_id: honda-civic10
vehicle: honda-civic10
display_name: "Honda Civic 10th Generation (2016–2021) donor cluster"
role: target
status: research
years: "2016-2021"
notes: >
  Encoder may emit labeled SYNTHETIC / RESEARCH_DOCUMENTED frames from opendbc
  vehicle-bus layouts. Cluster consumption for a donor cluster swap is NOT
  bench-verified. Default EncodeMode is NO_OUTPUT.

signals:
  - name: honda_checksum
    confidence: SUPPORTED_BY_MULTIPLE_SOURCES
    sources:
      - id: commaai_opendbc_honda_checksum
        citation: "commaai/opendbc honda_compute_checksum — (nibble sum) then (8-sum)&0xF"
        url: "https://github.com/commaai/opendbc"
    notes: "4-bit checksum low nibble; often with 2-bit counter. Apply only when evidenced."

  - name: engine_rpm
    confidence: SUPPORTED_BY_MULTIPLE_SOURCES
    can_id: "0x158"
    message: ENGINE_DATA
    sources:
      - id: commaai_opendbc_civic10
        citation: "opendbc Honda Civic 2016/2017 DBC — ENGINE_DATA / ENGINE_RPM"
        url: "https://github.com/commaai/opendbc"
    notes: "Vehicle-bus only. Cluster display path for donor swap NOT bench-verified."

  - name: vehicle_speed
    confidence: SUPPORTED_BY_MULTIPLE_SOURCES
    can_id: "0x309"
    message: CAR_SPEED
    sources:
