related_non_verified:
  - name: rusEFI can_dash_honda
    confidence: UNKNOWN
    notes: >
      rusEFI TX dash emulator (e.g. 0x1DC tach, 0x158 speed, 0x324 temp byte) —
      OEM-cluster drive hypothesis for unspecified platforms. Do NOT treat as
      Civic 8/10 verified OEM decode.
  - name: Racelogic / AiM Civic channel lists
    confidence: COMMUNITY_REPORTED
    notes: "Channel NAMES only; do not invent bit layouts from names."
  - name: nidec_scm_group_a SCM_FEEDBACK 0x294
    confidence: DOCUMENTED
    notes: >
      CR-V Touring 2016 uses LEFT/RIGHT_BLINKER on BO_ 660 (0x294) @5/@6 —
      different from Civic10 0x326. Tracked for CR-V, not Civic10 encoder.

