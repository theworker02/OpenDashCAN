        citation: "opendbc GEARBOX on 0x191 (classic GEAR_SHIFTER @5|6; CONFLICT with _gearbox_common)"
        url: "https://github.com/commaai/opendbc"
    notes: "Vehicle-bus only until cluster RX is captured. See conflicts.yaml."

  - name: powertrain_data
    confidence: SUPPORTED_BY_MULTIPLE_SOURCES
    can_id: "0x17C"
