        citation: "opendbc _steering_sensors_a.dbc STEER_ANGLE @7|16 scale -0.1"
        url: "https://github.com/commaai/opendbc"
    notes: "Decoded for analysis; not claimed as a cluster gauge input."

  - name: coolant_temperature
    confidence: UNKNOWN
    notes: >
      No SG_ COOLANT / ENGINE_TEMPERATURE packing in _honda_common or Civic
      generator DBCs. openpilot CHFFR_METRIC references msg 804 for
      ENGINE_TEMPERATURE without an SG_ layout — not usable as an encoding.
      AiM/Racelogic list channel names only.
  - name: fuel_level
    confidence: UNKNOWN
    notes: >
      No SG_ FUEL_LEVEL in opendbc Honda DBCs. TRIP_FUEL_CONSUMED on CRUISE
      0x324 is trip fuel, not tank level. AiM ECU_FUEL_LEV is a channel name only.
  - name: ignition_state
    confidence: UNKNOWN

