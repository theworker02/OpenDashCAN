  - name: turn_signal_left
    confidence: DOCUMENTED
    can_id: "0x326"
    message: SCM_FEEDBACK
    sources:
      - id: commaai_opendbc_scm_feedback
        citation: >
          opendbc _nidec_scm_group_b.dbc / _bosch_2018.dbc BO_ 806 SCM_FEEDBACK
          LEFT_BLINKER @26|1. Civic Touring 2016 (Nidec-B) and Hatchback EX 2017 (Bosch).
        url: "https://github.com/commaai/opendbc/tree/master/opendbc/dbc/generator/honda"
    notes: >
      Confirmed across Bosch and Nidec-B Civic platforms at 0x326.
      CR-V Touring 2016 Nidec-A uses different ID 0x294 — not this Civic10 packing.
      Cluster RX NOT PHYSICALLY_VERIFIED.

  - name: turn_signal_right
    confidence: DOCUMENTED
    can_id: "0x326"
    message: SCM_FEEDBACK
    sources:
