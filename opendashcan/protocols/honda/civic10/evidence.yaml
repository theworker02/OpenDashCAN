        citation: "opendbc CAR_SPEED on 0x309"
        url: "https://github.com/commaai/opendbc"
    notes: "Vehicle-bus only until cluster RX is captured."

  - name: gear_position
    confidence: SUPPORTED_BY_MULTIPLE_SOURCES
    can_id: "0x191"
    message: GEARBOX
