# Civic10 display-function requirements — eight axes resolved by gaps engine
# Do NOT promote LIKELY → CONFIRMED without evidence.
requirements:
  - signal: powertrain.engine_rpm
    priority: REQUIRED
    message: ENGINE_DATA
    arbitration_id: "0x158"
    producer: pcm
    bus: vehicle_can
    bus_confidence: DOCUMENTED
    cluster_rx_class: CLUSTER_LIKELY_RX
    period_ms: UNKNOWN
    timing_provenance: UNKNOWN
    integrity:
      checksum_type: honda_nibble_v1
      counter_type: honda_2bit_v1
    demonstrated: COMMUNITY_RESEARCH
    evidence: [ev_opendbc_civic10, EV-CX-001]
    notes: >
      Vehicle-bus ENGINE_RPM DOCUMENTED in opendbc. CivicX reports RPM after adapter —
      COMMUNITY_RESEARCH, not CLUSTER_RX_CONFIRMED / BENCH_VERIFIED.

