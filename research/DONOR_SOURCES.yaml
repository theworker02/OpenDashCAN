  - honda.civic.gen8.us   # strengthened discoverability / index
  - honda.civic.gen10.us  # pre-existing + DBC index
  - honda.civic.gen11.us  # latest Civic; vendored honda_civic_ex_2022
  - honda.accord.gen10.us
