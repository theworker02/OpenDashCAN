  - honda.crv.gen5.us
  - honda.crv.gen6.us     # CAN-FD RESEARCH_REQUIRED stub
  - honda.pilot.gen4.us   # CAN-FD RESEARCH_REQUIRED stub
  - honda.fit.gen3.us     # populated from fit EX 2018 DBC
  - honda.insight.gen3.us # created
  - honda.odyssey.gen5.us # populated from odyssey EX-L 2018 DBC

